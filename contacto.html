<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Ropa con estilo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" href="/image/logo.png">
    <link rel="stylesheet" href="css/style-contact.css">
</head>

<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="image/logo.png" alt="Logo" style="width: 100px; height: 40px;">
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item"><a class="nav-link nav-btn" href="index.html" style="color: black;"><i
                                    class="fas fa-home"></i> Inicio</a></li>
                        <li class="nav-item"><a class="nav-link nav-btn" href="nosotros.html"
                                style="color: black;"><i class="fas fa-address-card"></i> Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link nav-btn" href="tienda.html"
                                style="color: black;"><i class="fas fa-shopping-bag"></i> Tienda</a></li>
                        <li class="nav-item"><a class="nav-link nav-btn" href="equipo.html"
                                style="color: black;"><i class="fas fa-users-cog"></i> Equipo</a></li>
                        <li class="nav-item"><a class="nav-link nav-btn" href="contacto.html"
                                style="color: black;"><i class="fas fa-phone-alt"></i> Contacto</a></li>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main content -->
    <main class="container my-5 contacto">
        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="p-4 bg-green rounded shadow-sm" style="border: 2px solid rgb(0, 0, 0);">
                    <h3 class="mb-4">Encuéntranos</h3>
                    <p><strong>Teléfono:</strong> 900 000 000</p>
                    <p><strong>Email:</strong> tiendaconestilo@gmail.com</p>
                    <p><strong>Dirección:</strong> Av. Huánuco, Perú</p>
                    <img src="image/fondo-contacto.jpeg" alt="Tienda" class="img-fluid rounded mt-4 shadow-sm">
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <div class="p-4 bg-green rounded shadow-sm" style="border: 2px solid black; height: 36rem;">
                    <h3 class="mb-4">Contáctanos</h3>
                    <form onsubmit="return enviarFormulario(event)">
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre">
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" placeholder="Ingrese su teléfono">
                        </div>
                        <div class="form-group">
                            <label for="pedido">Correo Electronico</label>
                            <input type="text" class="form-control" id="correo" placeholder="Ingrese su correo">
                        </div>
                        <div class="form-group">
                            <label for="mensaje">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="4"
                                placeholder="Ingrese su mensaje"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success btn-block">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-white text-center py-4" style="background-color: black; color: white;">
        <img src="image/logo.png" alt="Moda" style="height: 5rem; width: 5rem;" class="img-fluid rounded img-hover">
        <div class="container" style="margin-top: 1rem;">
            <div class="row mb-3">
                <div class="col">
                    <a href="#" class="mr-3"><i class="fab fa-facebook fa-2x" style="color: #3b5998;"></i></a>
                    <a href="#" class="mr-3"><i class="fab fa-whatsapp fa-2x" style="color: #25D366;"></i></a>
                    <a href="#" class="mr-3"><i class="fab fa-instagram fa-2x" style="color: #e4405f;"></i></a>
                    <a href="#" class="mr-3"><i class="fab fa-linkedin fa-2x" style="color: #0077b5;"></i></a>
                </div>
            </div>
            <p>&copy; 2025 Ropa con estilo. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script>
        function enviarFormulario(event) {
            event.preventDefault();
            alert("¡Mensaje enviado correctamente! Nos pondremos en contacto contigo pronto.");
            document.querySelector("form").reset();
            return false;
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
